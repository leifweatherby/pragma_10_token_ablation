[model]
name = "nvidia/Nemotron-Cascade-8B"
think_substring = "think"
think_token_format = "<{tok}>"

[dataset]
name = "cais/mmlu"
config = "high_school_mathematics"
split = "validation"

[io]
output = "data/nemotron-cascade-8B_mmlu_high-school-mathematics_mask-topk10-unigrams"

[runtime]
batch_size = 32
seed = 357
attn_implementation = "sdpa"

[ablations]
judge = "claude-haiku-4-5"
base_url = "https://api.anthropic.com/v1/"
api_key = "ANTHROPIC_API_KEY"
metric = "fighting_words"
ngram_range = [1, 1]
strategy = "mask"
penalty_weight = 1.0
cutoff = 0.98
top_k = 10
max_steps = 100

[runs.think]
enable_thinking = true

[runs.think.generation]
do_sample = true
max_new_tokens = 16384
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0

[runs.no_think]
enable_thinking = false

[runs.no_think.generation]
do_sample = true
max_new_tokens = 4096
temperature = 0.7
top_p = 0.8
top_k = 20
