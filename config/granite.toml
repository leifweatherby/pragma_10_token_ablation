[model]
name = "ibm-granite/granite-3.3-2b-instruct"
think_substring = "think"
think_token_format = "<{tok}>"

[dataset]
name = "allenai/ai2_arc"
config = "ARC-Challenge"
split = "train[:1]"

[io]
output = "data/granite-test"

[runtime]
batch_size = 1
seed = 42
attn_implementation = "sdpa"

[ablations]
judge = "claude-haiku-4-5"
base_url = "https://api.anthropic.com/v1/"
api_key = "ANTHROPIC_API_KEY"
metric = "fighting_words"
ngram_range = [1, 3]
strategy = "mask"
penalty_weight = 1.0
cutoff = 0.95
top_k = ""
max_steps = 100

[runs.default]
enable_thinking = true

[runs.default.generation]
max_new_tokens = 128
do_sample = false
