[project]
authors = [{name = "Tyler Shoemaker", email = "69219954+t-shoemaker@users.noreply.github.com"}]
dependencies = []
name = "pragma"
requires-python = "< 3.14"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
pragma = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest -v"
data-auth = "rclone config create pragma drive scope=drive root_folder_id=13wRlxC5j7lzkaAA-kA1zFSFeKSGMr73s"
data-pull = "rclone copy pragma: data/ -P"
data-push = "rclone copy data/ pragma: -P"
app-setup = "test -d app/frontend/node_modules || (cd app/frontend && npm install) && python app/scripts/prepare_data.py"
app-dev = { cmd = "npm run dev", cwd = "app/frontend" }
app-build = { cmd = "npm install && python ../../app/scripts/ensure_data.py && python ../../app/scripts/prepare_data.py && npm run build", cwd = "app/frontend" }

# Base dependencies (always included)
[tool.pixi.dependencies]
nodejs = ">=20,<21"
rclone = ">=1.68.2,<2"

# Build feature - minimal dependencies for CloudFlare Pages builds
[tool.pixi.feature.build.pypi-dependencies]
transformers = ">=4.57.0,<5"

# Dev feature - full development stack
[tool.pixi.feature.dev.pypi-dependencies]
torch = ">=2.8.0,<3"
transformers = ">=4.57.0,<5"
accelerate = ">=1.10.1,<2"
datasets = ">=4.2.0,<5"
openai = ">=2.6.1,<3"
scipy = ">=1.17.0,<2"
seaborn = ">=0.13.2,<0.14"

[tool.pixi.feature.dev.dependencies]
ipykernel = ">=6.30.1,<7"
pytest = ">=8.0.0,<9"
ruff = ">=0.14.1,<0.15"

# Environments
[tool.pixi.environments]
default = {features = ["dev"], solve-group = "default"}
build = {features = ["build"], solve-group = "build"}
